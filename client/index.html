<!DOCTYPE html>
<html>
<head>
  <title>Taxi App</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div id="panel">
  <h2>🚕 Taxi App</h2>

  <button onclick="setMode('from')">Qayerdan</button>
  <button onclick="setMode('to')">Qayerga</button>
  <button onclick="callTaxi()">Taxi chaqirish</button>

  <div id="price"></div>
</div>

<div id="map"></div>

<script>
const socket = io();

let map = L.map('map').setView([41.31, 69.27], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let mode = null;
let from = null;
let to = null;

let fromMarker = null;
let toMarker = null;

function setMode(type){
  mode = type;

  if(type === 'from'){
    alert('Qayerdan nuqtani tanlang');
  }

  if(type === 'to'){
    alert('Qayerga nuqtani tanlang');
  }
}

map.on('click', function(e){

  if(mode === 'from'){
    from = {
      lat: e.latlng.lat,
      lng: e.latlng.lng
    };

    if(fromMarker){
      map.removeLayer(fromMarker);
    }

    fromMarker = L.marker(e.latlng)
      .addTo(map)
      .bindPopup('A')
      .openPopup();
  }

  if(mode === 'to'){
    to = {
      lat: e.latlng.lat,
      lng: e.latlng.lng
    };

    if(toMarker){
      map.removeLayer(toMarker);
    }

    toMarker = L.marker(e.latlng)
      .addTo(map)
      .bindPopup('B')
      .openPopup();
  }
});

function callTaxi(){
  console.log(from);
  console.log(to);

  if(!from || !to){
    alert('Avval A va B nuqtalarni tanlang');
    return;
  }

  socket.emit('newOrder', {
    from: from,
    to: to
  });

  alert('Taxi chaqirildi');
}

socket.on('orderAccepted', (order)=>{
  document.getElementById('price').innerHTML =
    'Narx: ' + order.price + " so'm";
});

socket.on('rideStarted', ()=>{
  alert('Safar boshlandi');
});

socket.on('rideFinished', ()=>{
  alert('Safar tugadi');
});
</script>

</body>
</html>
