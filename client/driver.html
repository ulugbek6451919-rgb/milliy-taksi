<!DOCTYPE html>
<html>
<head>
    <title>Driver Panel</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<h1>Driver Panel</h1>

<h2>Yangi buyurtmalar:</h2>

<div id="orders"></div>

<script>
const socket = io();

const ordersDiv = document.getElementById("orders");

// yangi taxi chaqirilsa
socket.on("newOrder", (order) => {
    console.log("Yangi order:", order);

    const div = document.createElement("div");
    div.style.border = "1px solid black";
    div.style.padding = "10px";
    div.style.margin = "10px";

    div.innerHTML = 
        <p><b>Pickup:</b> ${order.pickup}</p>
        <p><b>Destination:</b> ${order.destination}</p>
        <button onclick="acceptOrder('${order.pickup}','${order.destination}')">
            Qabul qilish
        </button>
    ;

    ordersDiv.appendChild(div);
});

// order qabul qilish
function acceptOrder(pickup, destination){
    socket.emit("acceptOrder", {
        pickup,
        destination,
        price: "50000"
    });

    alert("Buyurtma qabul qilindi");
}
</script>

</body>
</html>
